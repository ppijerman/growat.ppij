name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # Needed at build time for next.config.ts remotePatterns
          # TODO: update to custom domain URL once DNS + cert are configured
          BACKEND_API_URL: https://app-growat-cms.azurewebsites.net
          # Needed at build time for SSG page pre-rendering
          BACKEND_API_TOKEN: ${{ secrets.BACKEND_API_TOKEN }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
